---
- name: Install native VM and container packages
  ansible.builtin.apt:
    name: [acl, bridge-utils, docker.io, iproute2, iptables, iputils-ping, less, libvirt-daemon-system, nano, needrestart, openssh-server, openssl, qemu-system-x86, qemu-utils, socat, sudo]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the ordinary student account
  ansible.builtin.user:
    name: ubuntu
    shell: /bin/bash
    groups: [sudo, docker, kvm]
    append: true

- name: Permit hhfab's native host setup through sudo
  ansible.builtin.copy:
    content: "ubuntu ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/90-labapp-student
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Enable the native host services
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Verify nested virtualization is available
  ansible.builtin.stat:
    path: /dev/kvm
  register: host_kvm

- name: Require the actual KVM device before VLAB provisioning
  ansible.builtin.assert:
    that:
      - host_kvm.stat.ischr | default(false)
    fail_msg: The selected builder must expose nested virtualization at /dev/kvm.
