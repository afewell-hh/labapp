# Delta over the unchanged observability-values.yaml (pass both with --values, this one last).
# Sizes are disposable-pilot choices, not release sizing or a total disk quota.
prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retentionSize: 6GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi
grafana:
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  admin:
    existingSecret: labapp-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 30300
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
