---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Offline/component checks only, without cloud identity.
permissions:
  contents: read

jobs:
  pinned-api-fixture:
    name: Pinned public API serializer and typed-default comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Required pinned API cleanup diagnostics offline controls
        run: |
          timeout --kill-after=1s 15s python3 -I -B - <<'PY'
          from pathlib import Path
          import unittest
          root = Path.cwd()
          path = root / 'build/provision/test_pinned_api_hosted_cleanup.py'
          if not path.is_file():
              raise SystemExit('Required pinned API cleanup controls are missing')
          loader = unittest.TestLoader()
          suite = loader.discover(str(path.parent), pattern=path.name)
          import test_pinned_api_hosted_cleanup as controls
          assert Path(controls.__file__).resolve() == path.resolve()
          def ids(node):
              if isinstance(node, unittest.TestSuite):
                  return [item for child in node for item in ids(child)]
              return [node.id()]
          loaded = ids(suite)
          required = ids(loader.loadTestsFromTestCase(controls.HostedCleanupDiagnosticsTests))
          if (len(required) < 13 or len(loaded) != len(set(loaded))
                  or set(loaded) != set(required)):
              raise SystemExit('Required cleanup class or unique test coverage missing')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped
                           and result.testsRun == len(loaded) else 1)
          PY
      - name: Public preparation then isolated required offline fixture
        # Outer bound dominates phase maxima; reserve 75s for exact cleanup.
        run: timeout --kill-after=75s 23m bash build/provision/fixtures/pinned-api/run-hosted.sh

  inspection-offline:
    name: Private filesystem collector offline suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared owned-process deployment bytes
        run: cmp build/gcp/owned_process.py build/provision/owned_process.py
      - name: Install trusted lead-side YAML dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: Run required synthetic filesystem tests
        run: |
          test -f build/gcp/inspection/test_host_baseline.py
          test -f build/gcp/inspection/test_host_derive.py
          test -f build/gcp/inspection/test_collector.py
          test -f build/gcp/inspection/test_mounted_collect.py
          python3 -m unittest discover -s build/gcp/inspection -t build/gcp -v

  portable-builder-offline:
    name: Portable builder offline observer and execution-gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run required offline suites without builders or credentials
        run: |
          test -f build/packer-qemu/test_supervise.py
          test -f build/packer-qemu/test_host_verify.py
          test -f build/packer-qemu/test_container_runner.py
          test -f build/packer-qemu/test_stage_tools.py
          test -f build/packer-qemu/test_sentinel.py
          test -f build/packer-qemu/guest/assert-fixture.py
          test -f build/packer-qemu/test_sentinel_evidence.py
          test -f build/packer-qemu/test_runtime_prepare.py
          test -f build/packer-qemu/test_sentinel_expiry.py
          test_home=$(mktemp -d /tmp/labapp-portable-tests.XXXXXX)
          env -i HOME="$test_home" PATH=/usr/bin:/bin python3 -I -B - <<'PY'
          import os
          import sys
          import unittest
          sys.path.insert(0, os.path.abspath('build/packer-qemu'))
          loader = unittest.TestLoader()
          for pattern in ('test_supervise.py', 'test_host_verify.py', 'test_container_runner.py', 'test_stage_tools.py', 'test_sentinel.py', 'test_sentinel_evidence.py', 'test_runtime_prepare.py', 'test_sentinel_expiry.py'):
              required = loader.discover('build/packer-qemu', pattern=pattern)
              if required.countTestCases() == 0:
                  raise SystemExit(f'Required suite {pattern} discovered no tests')
          suite = loader.discover('build/packer-qemu', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  lint:
    name: Active shell, YAML, cloud-init and bootstrap checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint cloud-init python3-yaml
          shellcheck --version
          yamllint --version
          cloud-init --version
      - name: Test lifecycle access bootstrap without cloud credentials
        run: |
          test -f build/gcp/test_bootstrap_lifecycle_access.py
          python3 -m unittest discover -s build/gcp -p test_bootstrap_lifecycle_access.py -v
      - name: Check every active shell script
        shell: bash
        run: |
          set -euo pipefail
          # New active .sh files are included; historical code stays untouched.
          git ls-files -z '*.sh' ':(exclude)_archive/**' \
            ':(exclude)archive2/**' > /tmp/active-shell-files
          mapfile -d '' -t scripts < /tmp/active-shell-files
          ((${#scripts[@]} > 0))
          for script in "${scripts[@]}"; do
            echo "Validating: $script"
            bash -n "$script"
          done
          shellcheck -x "${scripts[@]}"
      - name: Lint active YAML
        run: |
          yamllint .yamllint.yml .github marketplace cloud-config.yaml wiringd.yaml
      - name: Validate cloud-init config schema
        run: |
          cloud-init schema --config-file cloud-config.yaml --annotate
          cloud-init schema --config-file build/packer-qemu/guest/user-data --annotate
      - name: Check embedded cloud-init shell without executing it
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tempfile
          import yaml

          config = yaml.safe_load(pathlib.Path("cloud-config.yaml").read_text())
          count = 0
          with tempfile.TemporaryDirectory() as directory:
              for entry in config.get("write_files", []):
                  if not entry["path"].endswith(".sh"):
                      continue
                  # Never use guest absolute paths as extraction targets.
                  script = pathlib.Path(directory) / f"script-{count}.sh"
                  script.write_text(entry["content"])
                  print(f"Checking embedded script: {entry['path']}", flush=True)
                  subprocess.run(["bash", "-n", str(script)], check=True)
                  subprocess.run(["shellcheck", "-x", str(script)], check=True)
                  count += 1
          if count == 0:
              raise SystemExit("Expected cloud-config write_files shell scripts")
          print(f"Validated {count} embedded shell scripts (not executed)")
          PY

  k3d-install:
    name: k3d install in two disposable Ubuntu containers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Ubuntu 24.04 manifest observed by the validated component test.
      K3D_TEST_IMAGE: ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    steps:
      - uses: actions/checkout@v4
      - name: Test module without guest Docker socket or credentials
        run: timeout --kill-after=30s 8m bash build/provision/test-install-k3d.sh 2

  lifecycle-offline:
    name: GCP lifecycle offline suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared owned-process deployment bytes
        run: cmp build/gcp/owned_process.py build/provision/owned_process.py
      - name: Run required lifecycle tests
        run: |
          test -f build/gcp/lifecycle/test_lifecycle.py
          test -f build/gcp/lifecycle/test_base_build.py
          test -f build/gcp/lifecycle/test_capture.py
          test -f build/gcp/lifecycle/test_access.py
          test -f build/gcp/lifecycle/test_access_recovery.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import unittest
          access = unittest.TestLoader().discover(
              'build/gcp/lifecycle', pattern='test_access.py', top_level_dir='build/gcp')
          if access.countTestCases() == 0:
              raise SystemExit('Required access suite discovered no tests')
          print(f'Required access tests: {access.countTestCases()}', flush=True)
          recovery = unittest.TestLoader().discover(
              'build/gcp/lifecycle', pattern='test_access_recovery.py', top_level_dir='build/gcp')
          if recovery.countTestCases() == 0:
              raise SystemExit('Required failed-disposal suite discovered no tests')
          print(f'Required failed-disposal tests: {recovery.countTestCases()}', flush=True)
          suite = unittest.TestLoader().discover('build/gcp/lifecycle', top_level_dir='build/gcp')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Run required fixed pre-login hook tests
        run: |
          test -f build/gcp/prelogin/test_prelogin.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import unittest
          suite = unittest.TestLoader().discover('build/gcp/prelogin', top_level_dir='build/gcp')
          if suite.countTestCases() == 0:
              raise SystemExit('Required pre-login suite discovered no tests')
          print(f'Required pre-login tests: {suite.countTestCases()}', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Run required fixed owner trial entrypoints
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          from pathlib import Path
          import unittest
          from build.gcp import vlab_trial
          assert Path(vlab_trial.__file__).resolve() == Path('build/gcp/vlab_trial.py').resolve()
          suite = unittest.TestLoader().discover('build/gcp', pattern='test_vlab_trial.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required owner trial suite discovered no tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Run required exact owner egress cleanup without subprocesses or network
        run: |
          test -f build/gcp/test_trial_egress.py
          test_home=$(mktemp -d /tmp/labapp-egress-tests.XXXXXX)
          cleanup_test_home() {
            primary_status=$?
            trap - EXIT
            cleanup_status=0
            rmdir -- "$test_home/tmp" || cleanup_status=1
            rmdir -- "$test_home" || cleanup_status=1
            if [ "$primary_status" -ne 0 ]; then exit "$primary_status"; fi
            exit "$cleanup_status"
          }
          trap cleanup_test_home EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir -m 700 "$test_home/tmp"
          timeout --kill-after=5s 60s env -i HOME="$test_home" TMPDIR="$test_home/tmp" PATH=/usr/bin:/bin python3 -I -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          import unittest
          def guard(event, args):
              if event.startswith(('socket.', 'subprocess.')) or event in {
                  'os.system', 'os.posix_spawn', 'os.fork', 'os.forkpty', 'os.exec'}:
                  raise RuntimeError('offline egress suite forbids processes and network')
          sys.addaudithook(guard)
          sys.path.insert(0, str(Path.cwd()))
          suite = unittest.TestLoader().discover('build/gcp', pattern='test_trial_egress.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required exact owner egress suite discovered no tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Run required fixed shared guest trial entrypoints
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          from pathlib import Path
          import unittest
          suite = unittest.TestLoader().discover('build/provision', pattern='test_vlab_trial.py')
          import vlab_trial
          assert Path(vlab_trial.__file__).resolve() == Path('build/provision/vlab_trial.py').resolve()
          if suite.countTestCases() == 0:
              raise SystemExit('Required guest trial suite discovered no tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  bridge-ipv4:
    name: Bridge IPv4 offline and disposable namespace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run required synthetic runtime tests
        run: |
          test -f build/provision/test_ensure_bridge_ipv4.py
          python3 -m unittest discover -s build/provision -p test_ensure_bridge_ipv4.py -v
          test -f build/provision/test_bridge_ipv4_harness.py
          python3 -m unittest discover -s build/provision -p test_bridge_ipv4_harness.py -v
      - name: Test unchanged helper with NET_ADMIN in an isolated namespace
        run: timeout --kill-after=60s 8m bash build/provision/test-bridge-ipv4.sh

  hhfab-offline:
    name: Official hhfab offline configuration proof (two versions)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared owned-process deployment bytes
        run: cmp build/gcp/owned_process.py build/provision/owned_process.py
      - name: Install distribution fixture-parser dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: Required integrity, bounds and ownership regression tests
        run: |
          test -f build/provision/test_hhfab_offline.py
          python3 -m unittest discover -s build/provision -p test_hhfab_offline.py -v
      - name: Required VLAB core offline entrypoint regressions
        shell: bash
        run: |
          set -euo pipefail
          test -f build/provision/test_vlab_core.py
          test_root=$(mktemp -d /tmp/labapp-vlab-core-tests.XXXXXX)
          root_identity=$(stat -c %d:%i:%u:%a -- "$test_root")
          home_identity=uncreated
          tmp_identity=uncreated
          cleanup_vlab_tests() {
            local primary=$? cleanup=0 owned expected
            trap - EXIT
            trap '' INT TERM
            if [[ ! -d "$test_root" || -L "$test_root" || $(stat -c %d:%i:%u:%a -- "$test_root") != "$root_identity" ]]; then
              echo 'VLAB core: host root identity changed; paths retained' >&2
              cleanup=1
            else
              for owned in "$test_root/tmp" "$test_root/home" "$test_root"; do
                case "$owned" in
                  "$test_root") expected=$root_identity ;;
                  "$test_root/home") expected=$home_identity ;;
                  "$test_root/tmp") expected=$tmp_identity ;;
                esac
                if [[ -d "$owned" && ! -L "$owned" && $(stat -c %d:%i:%u:%a -- "$owned") == "$expected" ]]; then
                  rmdir -- "$owned" || cleanup=1
                else
                  cleanup=1
                fi
                if [[ -e "$owned" || -L "$owned" ]]; then
                  cleanup=1
                else
                  printf 'VLAB core host cleanup absent: %s\n' "$owned"
                fi
              done
            fi
            if (( primary != 0 )); then exit "$primary"; fi
            exit "$cleanup"
          }
          trap cleanup_vlab_tests EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir -m 700 "$test_root/home" "$test_root/tmp"
          home_identity=$(stat -c %d:%i:%u:%a -- "$test_root/home")
          tmp_identity=$(stat -c %d:%i:%u:%a -- "$test_root/tmp")
          umask 022
          env -i HOME="$test_root/home" TMPDIR="$test_root/tmp" PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=10s 180s python3 -I -B - <<'PY'
          import os
          import stat
          import sys
          import unittest
          def audit(event, args):
              if event.startswith('socket.'):
                  raise RuntimeError('offline suite socket operation denied')
          sys.addaudithook(audit)
          print({'python': sys.version, 'uid': os.getuid(),
                 'home_mode': oct(stat.S_IMODE(os.stat(os.environ['HOME']).st_mode)),
                 'tmp_mode': oct(stat.S_IMODE(os.stat(os.environ['TMPDIR']).st_mode))}, flush=True)
          root = os.path.abspath('build/provision')
          sys.path.insert(0, root)
          suite = unittest.TestLoader().discover(root, pattern='test_vlab_core.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required VLAB core suite discovered no tests')
          print(f'Required VLAB core tests: {suite.countTestCases()}', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Run actual official CLI in isolated Ubuntu containers
        run: timeout --kill-after=30s 10m bash build/provision/test-hhfab-offline.sh

  hhfab-install:
    name: Pinned hhfab installer in two disposable Ubuntu containers
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Guest prerequisite offline failure and ownership tests
        run: python3 -m unittest discover -s build/provision -p test_component_prerequisites.py -v
      - name: Installer integrity and preservation regressions
        run: python3 -m unittest discover -s build/provision -p test_install_hhfab.py -v
      - name: Required Helm installer offline regressions
        shell: bash
        run: |
          set -euo pipefail
          test -f build/provision/test_install_helm.py
          test_root=$(mktemp -d /tmp/labapp-helm-tests.XXXXXX)
          root_identity=$(stat -c %d:%i:%u:%a -- "$test_root")
          home_identity=uncreated
          tmp_identity=uncreated
          cleanup_helm_tests() {
            primary=$?
            trap - EXIT
            cleanup=0
            for owned in "$test_root/tmp" "$test_root/home" "$test_root"; do
              case "$owned" in
                "$test_root") expected=$root_identity ;;
                "$test_root/home") expected=$home_identity ;;
                "$test_root/tmp") expected=$tmp_identity ;;
              esac
              if [[ -d "$owned" && ! -L "$owned" && $(stat -c %d:%i:%u:%a -- "$owned") == "$expected" ]]; then
                rmdir -- "$owned" || cleanup=1
              else
                cleanup=1
              fi
              if [[ -e "$owned" || -L "$owned" ]]; then
                cleanup=1
              else
                printf 'Helm test cleanup absent: %s\n' "$owned"
              fi
            done
            if (( primary != 0 )); then exit "$primary"; fi
            exit "$cleanup"
          }
          trap cleanup_helm_tests EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir -m 700 "$test_root/home" "$test_root/tmp"
          home_identity=$(stat -c %d:%i:%u:%a -- "$test_root/home")
          tmp_identity=$(stat -c %d:%i:%u:%a -- "$test_root/tmp")
          umask 022
          env -i HOME="$test_root/home" TMPDIR="$test_root/tmp" PATH=/usr/bin:/bin python3 -I -B - <<'PY'
          import os
          import stat
          import sys
          import unittest
          def audit(event, args):
              if event.startswith('socket.'):
                  raise RuntimeError('offline suite socket operation denied')
          sys.addaudithook(audit)
          print({'python': sys.version, 'uid': os.getuid(),
                 'home_mode': oct(stat.S_IMODE(os.stat(os.environ['HOME']).st_mode)),
                 'tmp_mode': oct(stat.S_IMODE(os.stat(os.environ['TMPDIR']).st_mode))}, flush=True)
          root = os.path.abspath('build/provision')
          sys.path.insert(0, root)
          suite = unittest.TestLoader().discover(root, pattern='test_install_helm.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required Helm suite discovered no tests')
          print(f'Required Helm tests: {suite.countTestCases()}', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Required Helm native-proof offline regressions
        shell: bash
        run: |
          set -euo pipefail
          test -f build/provision/test_helm_native_proof.py
          test_root=$(mktemp -d /tmp/labapp-helm-proof-tests.XXXXXX)
          root_identity=$(stat -c %d:%i:%u:%a -- "$test_root")
          home_identity=uncreated
          tmp_identity=uncreated
          # Hard cancellation gives no cleanup receipt; runner disposal is not one.
          cleanup_helm_tests() {
            local primary=$? cleanup=0 owned expected
            trap - EXIT
            trap '' INT TERM
            if [[ ! -d "$test_root" || -L "$test_root" || $(stat -c %d:%i:%u:%a -- "$test_root") != "$root_identity" ]]; then
              echo 'Helm proof: host root identity changed; paths retained' >&2
              cleanup=1
            else
              for owned in "$test_root/tmp" "$test_root/home" "$test_root"; do
                case "$owned" in
                  "$test_root") expected=$root_identity ;;
                  "$test_root/home") expected=$home_identity ;;
                  "$test_root/tmp") expected=$tmp_identity ;;
                esac
                if [[ -d "$owned" && ! -L "$owned" && $(stat -c %d:%i:%u:%a -- "$owned") == "$expected" ]]; then
                  rmdir -- "$owned" || cleanup=1
                else
                  cleanup=1
                fi
                if [[ -e "$owned" || -L "$owned" ]]; then
                  cleanup=1
                else
                  printf 'Helm proof host cleanup absent: %s\n' "$owned"
                fi
              done
            fi
            if (( primary != 0 )); then exit "$primary"; fi
            exit "$cleanup"
          }
          trap cleanup_helm_tests EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir -m 700 "$test_root/home" "$test_root/tmp"
          home_identity=$(stat -c %d:%i:%u:%a -- "$test_root/home")
          tmp_identity=$(stat -c %d:%i:%u:%a -- "$test_root/tmp")
          umask 022
          env -i HOME="$test_root/home" TMPDIR="$test_root/tmp" PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 python3 -I -B - <<'PY'
          import os
          import stat
          import sys
          import unittest
          def audit(event, args):
              if event.startswith('socket.'):
                  raise RuntimeError('offline suite socket operation denied')
          sys.addaudithook(audit)
          print({'python': sys.version, 'uid': os.getuid(),
                 'home_mode': oct(stat.S_IMODE(os.stat(os.environ['HOME']).st_mode)),
                 'tmp_mode': oct(stat.S_IMODE(os.stat(os.environ['TMPDIR']).st_mode))}, flush=True)
          root = os.path.abspath('build/provision')
          sys.path.insert(0, root)
          suite = unittest.TestLoader().discover(root, pattern='test_helm_native_proof.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required Helm native-proof suite discovered no tests')
          print(f'Required Helm native-proof tests: {suite.countTestCases()}', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Required kubectl installer offline regressions
        run: |
          test -f build/provision/test_install_kubectl.py
          test_home=$(mktemp -d /tmp/labapp-kubectl-tests.XXXXXX)
          mkdir -m 700 "$test_home/tmp"
          trap 'rmdir "$test_home/tmp" "$test_home"' EXIT
          umask 022
          env -i HOME="$test_home" TMPDIR="$test_home/tmp" PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 python3 -I -B - <<'PY'
          import os
          import stat
          import sys
          import unittest
          print({'python': sys.version, 'uid': os.getuid(),
                 'home_mode': oct(stat.S_IMODE(os.stat(os.environ['HOME']).st_mode)),
                 'tmp_mode': oct(stat.S_IMODE(os.stat(os.environ['TMPDIR']).st_mode))}, flush=True)
          root = os.path.abspath('build/provision')
          sys.path.insert(0, root)
          suite = unittest.TestLoader().discover(root, pattern='test_install_kubectl.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required kubectl suite discovered no tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Required kubectl native-proof offline regressions
        run: |
          test -f build/provision/test_kubectl_native_proof.py
          test_home=$(mktemp -d /tmp/labapp-kubectl-proof-tests.XXXXXX)
          mkdir -m 700 "$test_home/tmp"
          trap 'rmdir "$test_home/tmp" "$test_home"' EXIT
          umask 022
          env -i HOME="$test_home" TMPDIR="$test_home/tmp" PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 python3 -I -B - <<'PYTEST'
          import os
          import stat
          import sys
          import unittest
          print({'python': sys.version, 'uid': os.getuid(),
                 'home_mode': oct(stat.S_IMODE(os.stat(os.environ['HOME']).st_mode)),
                 'tmp_mode': oct(stat.S_IMODE(os.stat(os.environ['TMPDIR']).st_mode))}, flush=True)
          root = os.path.abspath('build/provision')
          sys.path.insert(0, root)
          suite = unittest.TestLoader().discover(root, pattern='test_kubectl_native_proof.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required kubectl native-proof suite discovered no tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PYTEST
      - name: Run unchanged installer and installed CLI smoke checks
        run: timeout --kill-after=30s 10m bash build/provision/test-install-hhfab.sh

  qemu-prerequisites:
    name: Signed snapshot QEMU online and offline installation and TCG fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Docker component offline mocked regressions
        run: |
          test -f build/provision/test_install_docker.py
          test_home=$(mktemp -d /tmp/labapp-docker-tests.XXXXXX)
          mkdir -m 700 "$test_home/tmp"
          umask 022
          env -i HOME="$test_home" TMPDIR="$test_home/tmp" PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 python3 -I -B - <<'PY'
          import os
          import sys
          import unittest
          root = os.path.abspath('build/provision')
          sys.path.insert(0, root)
          suite = unittest.TestLoader().discover(root, pattern='test_install_docker.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required Docker suite discovered no tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Docker container harness offline mocked lifecycle regressions
        run: |
          test -f build/provision/test_docker_container.py
          test_home=$(mktemp -d /tmp/labapp-docker-harness-tests.XXXXXX)
          mkdir -m 700 "$test_home/tmp"
          umask 022
          env -i HOME="$test_home" TMPDIR="$test_home/tmp" PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 python3 -I -B - <<'PYTEST'
          import os
          import sys
          import unittest
          root = os.path.abspath('build/provision')
          sys.path.insert(0, root)
          suite = unittest.TestLoader().discover(root, pattern='test_docker_container.py')
          if suite.countTestCases() == 0:
              raise SystemExit('Required Docker harness suite discovered no tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PYTEST
      - name: Required failure and bounded execution regressions
        run: |
          test -f build/provision/test_qemu.py
          python3 -I -B - <<'PYTEST'
          import os
          import sys
          import unittest
          root = os.path.abspath('build/provision')
          sys.path.insert(0, root)
          import test_qemu
          required_class = getattr(test_qemu, 'OverflowObservationTests', None)
          if not isinstance(required_class, type) or not issubclass(required_class, unittest.TestCase):
              raise SystemExit('Required QEMU overflow observation class is absent')
          loader = unittest.TestLoader()
          required = loader.loadTestsFromTestCase(required_class)
          if required.countTestCases() == 0:
              raise SystemExit('Required QEMU overflow observation class discovered no tests')
          suite = loader.discover(root, pattern='test_qemu.py')
          def test_ids(tests):
              for test in tests:
                  if isinstance(test, unittest.TestSuite):
                      yield from test_ids(test)
                  else:
                      yield test.id()
          if suite.countTestCases() == 0 or not set(test_ids(required)).issubset(set(test_ids(suite))):
              raise SystemExit('Required QEMU tests missing from discovery')
          print(f'Required QEMU tests: {suite.countTestCases()}; overflow: {required.countTestCases()}', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PYTEST
      - name: Offline data, target drift and downloader ownership regressions
        run: python3 -m unittest discover -s build/provision -p test_qemu_offline.py -v
      - name: Two fresh unchanged installations and nonroot offline fixture
        run: timeout --kill-after=30s 20m bash build/provision/test-qemu.sh
      - name: Actual captured-state acquisition and disconnected unchanged installation
        run: timeout --kill-after=30s 20m bash build/provision/test-qemu-offline.sh
