---
name: Docker package native install and rerun proof

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-package-proof
  cancel-in-progress: false

jobs:
  package-proof:
    if: >-
      github.repository_id == '1089062808' &&
      github.repository_owner_id == '193945001' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record public source and host identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git show -s --format='Source commit %H tree %T' HEAD
          sha256sum build/provision/test-docker.sh build/provision/docker_container.py \
            build/provision/install-docker.py build/provision/hhfab_release.py
          /usr/bin/python3 -I -B -c 'import os,platform,sys; print("Host Python",sys.version); print("Host UID",os.getuid()); print("Host",platform.platform())'
      - name: One bounded package-only native trial
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          private="$(mktemp -d "$RUNNER_TEMP/labapp-docker-proof.XXXXXXXX")"
          chmod 700 "$private"
          mkdir -m 700 "$private/home" "$private/tmp" "$private/docker-config"
          # No host credentials/configuration enter the native harness environment.
          # A hard runner cancellation relies on hosted-runner disposal; it is not
          # an observed exact container-cleanup receipt.
          cleanup_host() {
            local result=$?
            trap - EXIT
            rmdir -- "$private/home" "$private/tmp" "$private/docker-config" "$private" || {
              echo 'docker proof: private host directory cleanup failed' >&2
              [[ "$result" -ne 0 ]] || result=1
            }
            exit "$result"
          }
          trap cleanup_host EXIT
          env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME="$private/home" \
            TMPDIR="$private/tmp" DOCKER_CONFIG="$private/docker-config" \
            LANG=C LC_ALL=C /usr/bin/timeout --kill-after=5s 10s \
            /usr/bin/docker version --format 'Host Docker client {{.Client.Version}} server {{.Server.Version}}'
          env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME="$private/home" \
            TMPDIR="$private/tmp" LANG=C LC_ALL=C PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/timeout --kill-after=30s 11m \
            /usr/bin/bash build/provision/test-docker.sh
