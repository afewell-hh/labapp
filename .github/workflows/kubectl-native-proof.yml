---
name: kubectl native install and rerun proof

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubectl-native-proof
  cancel-in-progress: false

jobs:
  kubectl-proof:
    if: >-
      github.repository_id == '1089062808' &&
      github.repository_owner_id == '193945001' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record public source and host identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git show -s --format='Source commit %H tree %T' HEAD
          sha256sum build/provision/kubectl_native_proof.py build/provision/install-kubectl.py \
            build/provision/hhfab_release.py
          printf 'Runner image %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          /usr/bin/python3 -I -B -c 'import os,platform,sys; print("Host Python",sys.version); print("Host UID",os.getuid()); print("Host",platform.platform())'
      - name: One bounded native install and rerun trial
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          proof="$PWD/build/provision/kubectl_native_proof.py"
          private="$(mktemp -d "$RUNNER_TEMP/labapp-kubectl-proof.XXXXXXXX")"
          chmod 700 "$private"
          mkdir -m 700 "$private/home" "$private/tmp"
          # Hard cancellation gives no cleanup receipt; runner disposal is not one.
          cleanup_host() {
            local result=$?
            trap - EXIT
            rmdir -- "$private/home" "$private/tmp" "$private" || {
              echo 'kubectl proof: private host directory cleanup failed' >&2
              [[ "$result" -ne 0 ]] || result=1
            }
            exit "$result"
          }
          trap cleanup_host EXIT
          env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME="$private/home" TMPDIR="$private/tmp" \
            LANG=C LC_ALL=C PYTHONDONTWRITEBYTECODE=1 /usr/bin/timeout --kill-after=30s 700s \
            /usr/bin/python3 -B "$proof" --root "$private" --commit "$commit" --tree "$tree" \
            --runner-image "$image"
